name: 버그 신고
description: 패치 실패, 오류, 화면 문제를 알려 주세요.
title: "[버그] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요
      description: 무엇을 했고 어떤 화면이나 문구가 나왔는지 적어 주세요. 화면 캡처를 붙여도 됩니다.
    validations:
      required: true
  - type: dropdown
    id: server
    attributes:
      label: 대상
      options:
        - 본섭
        - 테섭
    validations:
      required: true
  - type: textarea
    id: diagnosis
    attributes:
      label: 검사 내용
      description: 앱의 검사 페이지에서 복사를 눌러 그대로 붙여 넣어 주세요. 사용자 이름과 컴퓨터 이름은 들어 있지 않습니다.
      render: text
    validations:
      required: false
  - type: textarea
    id: measured
    attributes:
      label: 측정 결과
      description: 패치를 끝까지 마친 뒤의 문제라면 측정 결과 복사를 눌러 붙여 넣어 주세요.
      render: text
    validations:
      required: false
