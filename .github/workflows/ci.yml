name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Nothing is debugged here: without debug information the build is quicker and what is
  # kept of it for the next run is smaller.
  CARGO_PROFILE_DEV_DEBUG: 0

# The jobs run side by side. Each of them that builds Rust keeps what it built for the next
# run, under a name of its own, whether or not it passed.
jobs:
  page:
    name: 화면 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: 화면 의존성 설치
        run: yarn install --frozen-lockfile

      - name: 화면 빌드
        run: yarn build

      # The engine's tests are spread over several jobs by name (see `test`). A test file
      # that is in none of them would never be run, so that is asked here.
      - name: 엔진 테스트 파일이 모두 나뉘어 있는지 확인
        run: |
          for file in crates/engine/tests/*.rs; do
            name=$(basename "$file" .rs)
            grep -q -w -e "--test $name" .github/workflows/ci.yml || { echo "::error::$name is in no test job"; exit 1; }
          done

  lint:
    name: 형식과 린트
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Asked first: it needs nothing built, and says no within seconds.
      - name: 형식 확인
        run: cargo fmt --all -- --check

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: 화면 의존성 설치
        run: yarn install --frozen-lockfile

      # The app's build embeds the page, so the page is built before the app is.
      - name: 화면 빌드
        run: yarn build

      - name: 린트
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: 테스트 (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      # One part failing does not stop the others: all of what fails is seen in one run.
      fail-fast: false
      matrix:
        include:
          - id: app
            name: 앱
            cache: app
            packages: -p maple-fast-patch
            page: true
          # The engine's tests run whole patches and take minutes, so they are four jobs,
          # about as long as one another. They build the same things and keep them as one.
          - id: engine-immediate
            name: 엔진 · immediate
            cache: engine
            packages: -p mfp-engine --test immediate
          - id: engine-hardening
            name: 엔진 · hardening, container, patching, 단위
            cache: engine
            packages: -p mfp-engine --lib --test hardening --test container --test patching
            docs: -p mfp-engine
          - id: engine-hostile
            name: 엔진 · hostile_folder, attacks
            cache: engine
            packages: -p mfp-engine --test hostile_folder --test attacks
          - id: engine-download
            name: 엔진 · download, rebuild
            cache: engine
            packages: -p mfp-engine --test download --test rebuild
          - id: check
            name: 검사
            cache: check
            packages: -p mfp-check
          - id: kms-tools
            name: 넥슨 연동과 도구
            cache: kms-tools
            packages: -p mfp-kms -p mfp-tools
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.cache }}
          cache-on-failure: true

      # Only the app embeds the page; the other parts are built without it.
      - uses: actions/setup-node@v4
        if: matrix.page
        with:
          node-version: 24
          cache: yarn

      - name: 화면 의존성 설치
        if: matrix.page
        run: yarn install --frozen-lockfile

      - name: 화면 빌드
        if: matrix.page
        run: yarn build

      - name: 테스트
        run: cargo test --locked ${{ matrix.packages }}

      # The examples in the documentation are tests of their own, and are asked for apart.
      - name: 문서 예제 테스트
        if: matrix.docs
        run: cargo test --locked ${{ matrix.docs }} --doc
