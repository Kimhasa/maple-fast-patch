[workspace]
resolver = "3"
members = ["src-tauri", "crates/engine", "crates/kms", "crates/tools", "crates/check"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
